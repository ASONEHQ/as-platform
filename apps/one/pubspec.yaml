name: as_one
description: AS ONE responsive web application foundation.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  go_router: ^17.1.0
  http: ^1.6.0
  # TASK 14.5A: used directly by `ApiClient.postMultipart` (the branding
  # logo upload's `Content-Type: image/...` file part) -- already a
  # transitive dependency of `http` (its own multipart internals), added
  # here as a direct dependency since this app's own code now imports it.
  http_parser: ^4.1.2
  # TASK 14.5A: legacy parity for `AS POS V1.html`'s
  # `cfgNegocioLogoSeleccionado()` (an operator picking a real image file
  # to use as the business logo). `apps/one` targets Flutter Web only (see
  # the `web/` directory -- no `android/`/`ios/`/`windows/`/`macos/`/
  # `linux/` platform folders exist in this app), so the picker must work
  # there: `image_picker`'s federated web implementation
  # (`image_picker_for_web`, pulled in automatically) uses a real HTML
  # file input under the hood, exactly the mechanism the legacy HTML's own
  # `<input type=file>` used.
  image_picker: ^1.2.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Canonical ACCESS GO brand asset (TASK 16.12), source of truth:
  # `C:\Users\InMagic\Downloads\logo accessgo\accessgo.png` (400x219 PNG,
  # RGBA, transparent background). Copied verbatim, at full resolution, no
  # crop/stretch/recolor. Reused at every size the startup flow, login
  # card, and shared POS chrome need the real mark instead of drawn text —
  # see `StartupLogoMark` in `lib/features/authentication/startup_visuals.dart`.
  # `as_logo_mark.png` (the previous "AS+" square icon) stays on disk,
  # unreferenced by any of those, since TASK 16.9's own receipt-branding
  # default-mark handling reads it independently (a tenant's own uploaded
  # logo takes priority there regardless — see `receipt_html.dart`) and
  # this task does not touch receipt/merchant branding.
  #
  # `access_go_logo_white.png` (TASK 16.12A): a white monochrome rendition
  # of the same artwork (same geometry/alpha mask, every visible pixel
  # recolored pure white), generated deterministically from
  # `access_go_logo.png` — used only on the strong blue/dark splash
  # background where the normal blue/cyan mark loses contrast.
  assets:
    - assets/branding/as_logo_mark.png
    - assets/branding/access_go_logo.png
    - assets/branding/access_go_logo_white.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Questrial (TASK 12.2G) — the canonical HTML's own `@font-face` (a
  # single `normal`/400 TrueType cut, base64-embedded at
  # `AS POS V1.html` line 10) extracted verbatim and bundled here, not
  # downloaded from anywhere external. Confirmed via the font's own
  # `name` table: family "Questrial", subfamily "Regular" — the same
  # single-weight open-source (OFL) geometric sans V1 applies to its
  # entire document (`html,*{font-family:'Questrial',sans-serif}`).
  # `pos_tokens.dart` referenced this family since TASK 12.1 with no
  # asset behind it (a documented, longstanding gap); this closes it and
  # extends the family to `AsTheme` too — see
  # `design_system/tokens/as_typography.dart`. There is no separate bold
  # cut in the HTML either (only one `@font-face`), so heavier
  # `FontWeight`s render at this same regular outline in both V1 (via the
  # browser's own synthetic bolding) and here — documented, not a bug.
  fonts:
    - family: Questrial
      fonts:
        - asset: assets/fonts/Questrial-Regular.ttf
